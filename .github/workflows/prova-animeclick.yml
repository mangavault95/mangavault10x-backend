name: Prova AnimeClick (temporanea)

# Una sola richiesta, con la firma dichiarata del progetto, per capire se il 403 vale anche
# per gli indirizzi di GitHub o solo per quelli di Render. Da cancellare dopo la prova.
on:
  push:
    branches: ["claude/mangavault-improvement-margins-7vmf2f"]
    paths: [".github/workflows/prova-animeclick.yml"]

jobs:
  prova:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS -o /dev/null -m 30 -w "calendario HTTP %{http_code}, %{size_download} byte\n" \
            -A "MangaVault/1.0 (collezione personale; +https://mangavault10x-frontend.vercel.app)" \
            "https://www.animeclick.it/calendario-anime?paging=next-month" || true
