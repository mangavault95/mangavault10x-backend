name: Prova AnimeClick (temporanea)

# Una sola richiesta, con la firma dichiarata del progetto: la pagina delle edizioni di una
# serie contiene le copertine dei singoli volumi? Da cancellare dopo la prova.
on:
  push:
    branches: ["claude/mangavault-improvement-margins-7vmf2f"]
    paths: [".github/workflows/prova-animeclick.yml"]

jobs:
  prova:
    runs-on: ubuntu-latest
    steps:
      - run: |
          codice=$(curl -sSL -o ed.html -m 40 -w "%{http_code}" \
            -A "MangaVault/1.0 (collezione personale; +https://mangavault10x-frontend.vercel.app)" \
            "https://www.animeclick.it/manga/9553/-/edizioni") || codice=000
          echo "HTTP $codice, $(wc -c < ed.html) byte (seguendo i reindirizzamenti)"
          echo "--- righe della tabella: $(grep -o '<tr' ed.html | wc -l)"
          echo "--- tag <img> dentro il tbody (primi 6):"
          sed -n '/<tbody/,/<\/tbody>/p' ed.html | grep -o '<img[^>]*>' | head -6 | cut -c1-260
          echo "--- prima riga della tabella:"
          sed -n '/<tbody/,/<\/tbody>/p' ed.html | tr -d '\n' | grep -o '<tr.*\?</tr>' | head -c 1500 | sed 's/<tr/\n<tr/g' | sed -n 2,3p | cut -c1-900
          echo "--- link a /edizione/ nella tabella (primi 5):"
          sed -n '/<tbody/,/<\/tbody>/p' ed.html | grep -o 'href="[^"]*edizione[^"]*"' | head -5
