name: Rapporto volumi Italia

# Due giri, entrambi su services/rapportoVolumi.js.
#
# OGNI LUNEDÌ: quanti volumi sono usciti in Italia (le serie in corso e le concluse a cui ancora mancano
# volumi), perché i volumi escono ogni settimana e con un controllo mensile «Da comprare» restava indietro.
#
# IL 3 DEL MESE: lo stesso giro, e in più si legge lo stato dell'edizione italiana di OGNI serie in corso.
# Quelle che in Italia risultano concluse passano a «conclusa» e non restano in corso per sempre.
#
# PERCHÉ LE PAGINE LE SCARICA GITHUB E NON RENDER: da Render AnimeClick risponde 403, da GitHub no (vedi
# calendario-anime.yml e sql/032). Il giro settimanale legge una pagina per serie (la pagina delle
# edizioni), quello mensile due: con una pagina ogni otto secondi sono cinque minuti circa, il mensile
# dieci. Per questo gira più tardi (8 UTC) del giro delle uscite (6:15) e delle copertine (6:45): non
# partono insieme, e `concurrency` lo garantisce.
#
# Se AnimeClick rifiuta o è in pausa il giro del backend parte comunque: per le serie senza pagina usa la
# riserva (l'archivio delle uscite di Fumettologica). Poi il giro risulta fallito, se è stato un rifiuto.
on:
  schedule:
    - cron: "0 8 * * 1"
    - cron: "30 8 3 * *"
  workflow_dispatch:
    inputs:
      controllaStato:
        description: "Controlla anche lo stato italiano (giro mensile)"
        type: boolean
        default: false
      prova:
        description: "Attivo: legge e conta, ma non scrive"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: animeclick
  cancel-in-progress: false

jobs:
  rapporto-volumi:
    runs-on: ubuntu-latest
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      PROVA: ${{ inputs.prova || false }}
      GIRO_MENSILE: ${{ github.event.schedule == '30 8 3 * *' || inputs.controllaStato == true }}
    steps:
      - uses: actions/checkout@v4

      - name: Scarica le pagine
        id: pagine
        run: |
          if [ "$GIRO_MENSILE" = "true" ]; then bash .github/scripts/scarica-pagine.sh rapporto "&stato=1"
          else bash .github/scripts/scarica-pagine.sh rapporto; fi

      # Anche senza pagine (rifiuto, pausa): il backend ripiega su Fumettologica.
      - name: Il backend fa il rapporto
        run: |
          codice=$(curl -sS -o risposta.json -w "%{http_code}" -X POST --max-time 600 \
            -H "X-Cron-Secret: ${CRON_SECRET}" -H "Content-Type: application/json" \
            -d "{\"scrivi\": $([ "$PROVA" = "true" ] && echo false || echo true), \"controllaStato\": ${GIRO_MENSILE}}" \
            "https://mangavault10x-api.onrender.com/api/manga/rapporto-volumi")
          jq -c '{totale, mappate, scritte, conteggi, concluse: (.concluse | length)}' risposta.json
          [ "$codice" = "200" ] || { echo "HTTP $codice"; exit 1; }

      - name: AnimeClick ha rifiutato?
        if: steps.pagine.outputs.rifiutato == '1'
        run: |
          echo "AnimeClick ha rifiutato questo giro (vedi i messaggi sopra): il rapporto è andato avanti con la riserva." >&2
          exit 1
